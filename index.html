<style>
:root{--h:330;--a:hsl(var(--h) 80% 60%);--a2:hsl(calc(var(--h) + 40) 85% 65%);--cb:var(--a);--bg:#fff5f8;--tx:#2a1a22;--gl:rgba(255,255,255,.45);--bd:rgba(255,255,255,.7);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#150d12;--tx:#fbeef3;--gl:rgba(255,255,255,.1);--bd:rgba(255,255,255,.2)}}
:root[data-theme=dark]{--bg:#150d12;--tx:#fbeef3;--gl:rgba(255,255,255,.1);--bd:rgba(255,255,255,.2)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
.bl{position:fixed;border-radius:50%;filter:blur(70px);opacity:.55;animation:fl 12s ease-in-out infinite alternate;z-index:0}
.b1{width:300px;height:300px;background:var(--a);top:-80px;left:-80px}
.b2{width:280px;height:280px;background:var(--a2);bottom:-60px;right:-80px;animation-delay:-5s}
@keyframes fl{to{transform:translate(40px,60px) scale(1.2)}}
@keyframes pop{from{opacity:0;transform:scale(.9) translateY(8px)}}
@keyframes pu{50%{box-shadow:0 0 0 10px rgba(255,60,60,.25)}}
.v{position:absolute;inset:0;padding:20px 20px 110px;overflow-y:auto;z-index:1;opacity:0;pointer-events:none;transform:translateY(16px) scale(.98);transition:opacity .5s ease,transform .5s cubic-bezier(.2,.8,.2,1)}
.v.on{opacity:1;pointer-events:auto;transform:none}
.gl{background:var(--gl);border:1px solid var(--bd);backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);border-radius:24px;box-shadow:0 8px 30px rgba(0,0,0,.1),inset 0 1px 0 rgba(255,255,255,.5)}
.logo{font-size:34px;font-weight:800;text-align:center;margin:30px 0 6px;background:linear-gradient(90deg,var(--a),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{text-align:center;opacity:.7;margin-bottom:24px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:15px;border:0;border-radius:18px;font-size:16px;font-weight:600;color:var(--tx);cursor:pointer;margin-bottom:12px;transition:transform .2s}
.btn:active{transform:scale(.97)}
.pr{background:linear-gradient(90deg,var(--a),var(--a2));color:#fff}
.btn.on{outline:2px solid var(--a)}
input[type=email],input[type=text],input[type=password],input[type=date]{width:100%;padding:14px;border-radius:16px;border:1px solid var(--bd);background:var(--gl);color:var(--tx);font-size:16px;margin:6px 0 14px;outline:0}
label{font-size:13px;opacity:.7}
.card{padding:20px;margin-bottom:16px}
.big{font-size:56px;font-weight:800;text-align:center;line-height:1;background:linear-gradient(90deg,var(--a),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#aaa;margin-right:6px}
.dot.on{background:#2ecc71;box-shadow:0 0 10px #2ecc71}
.row{display:flex;align-items:center;gap:12px}
.av{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--a),var(--a2)) center/cover;display:grid;place-items:center;font-size:26px;color:#fff;flex:none;cursor:pointer}
h2{margin:6px 0 16px}
.nav{position:fixed;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;gap:10px;align-items:center}
.nav .pill{display:flex;padding:6px;gap:4px;flex:1;border-radius:30px}
.nav .pill button{flex:1;border:0;background:none;color:var(--tx);padding:11px 2px;border-radius:24px;font-size:14px;font-weight:600;cursor:pointer;transition:.35s}
.nav .pill button.on{background:linear-gradient(90deg,var(--a),var(--a2));color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.rb{width:56px;height:56px;border-radius:50%;font-size:22px;color:var(--tx);cursor:pointer;flex:none;padding:0;transition:.3s}
.rb.on{background:linear-gradient(135deg,var(--a),var(--a2));color:#fff}
.mi{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;margin-bottom:12px;font-weight:600;cursor:pointer;transition:transform .2s}
.mi:active{transform:scale(.97)}
.sw{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0 4px}
.sw i{width:38px;height:38px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:.2s}
.sw i.on{border-color:var(--tx);transform:scale(1.12)}
.gm{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gm .gl{padding:22px 10px;text-align:center;font-weight:700;cursor:pointer;transition:transform .2s;font-size:15px}
.gm .gl:active{transform:scale(.95)}
.gm span{font-size:34px;display:block;margin-bottom:6px}
.code{font-size:28px;letter-spacing:4px;font-weight:800;text-align:center;margin:8px 0}
.link{background:none;border:0;color:var(--a);font-size:16px;cursor:pointer;padding:4px 0;margin-bottom:6px}
.ttt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:300px;margin:14px auto}
.ttt button{aspect-ratio:1;font-size:40px;font-weight:800;border:1px solid var(--bd);background:var(--gl);border-radius:18px;color:var(--a);cursor:pointer}
.b8{display:grid;grid-template-columns:repeat(8,1fr);max-width:380px;margin:14px auto;border-radius:14px;overflow:hidden;border:2px solid var(--bd)}
.b8 button{aspect-ratio:1;border:0;padding:0;font-size:clamp(18px,7vw,30px);cursor:pointer;line-height:1}
.b8 .lt{background:hsl(var(--h) 60% 92%)}.b8 .dk{background:hsl(var(--h) 40% 50%)}
.b8 .sel{background:#ffd54f!important}.b8 .tg{box-shadow:inset 0 0 0 4px #4caf50}
.pw{color:#fff;text-shadow:0 0 2px #000,0 0 3px #000}.pk{color:#1b1b1b}
.uno{display:flex;flex-direction:column;align-items:center;gap:16px;margin-top:10px}
.hand{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.uc{min-width:44px;height:64px;border-radius:10px;color:#fff;font-weight:800;display:grid;place-items:center;border:2px solid #fff;font-size:18px;cursor:pointer;padding:0 4px}
.u-r{background:#e53935}.u-y{background:#f9a825}.u-g{background:#43a047}.u-b{background:#1e88e5}.u-W{background:#333}
#chat{display:flex;flex-direction:column;padding:12px 14px 88px}
.ch{display:flex;gap:10px;align-items:center}
.oval{flex:1;display:flex;align-items:center;gap:10px;padding:6px 18px 6px 6px;border-radius:40px}
.oval .av{width:46px;height:46px;font-size:18px;cursor:default}
.dots{width:46px;height:46px;border-radius:50%;font-size:20px;color:var(--tx);cursor:pointer;padding:0}
#dd{position:absolute;top:70px;right:14px;z-index:6;padding:8px;display:none;min-width:190px}
#dd.on{display:block;animation:pop .25s}
#dd button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--tx);padding:12px;font-size:15px;border-radius:14px;cursor:pointer}
#ms{flex:1;overflow-y:auto;padding:12px 2px;display:flex;flex-direction:column;gap:8px}
.m{align-self:flex-end;max-width:78%;padding:9px 13px;border-radius:20px 20px 4px 20px;background:var(--cb);color:#fff;animation:pop .3s;word-break:break-word}
.m img{max-width:100%;border-radius:14px;display:block}.m audio{width:210px;height:36px}
.m small{display:block;font-size:10px;opacity:.7;text-align:right;margin-top:3px}
.inp{display:flex;gap:4px;align-items:center;padding:5px 5px 5px 16px;border-radius:34px}
.inp input{flex:1;margin:0;border:0;background:none;padding:10px 0;min-width:0}
.ib{width:44px;height:44px;border-radius:50%;border:0;background:none;font-size:20px;cursor:pointer;color:var(--tx)}
.ib.rc{background:#ff3b3b;animation:pu 1s infinite}
.m.him{align-self:flex-start;background:var(--gl);color:var(--tx);border:1px solid var(--bd);border-radius:20px 20px 20px 4px}
</style></head><body>
